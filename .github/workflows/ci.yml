name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Yapılandır
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Derle
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
